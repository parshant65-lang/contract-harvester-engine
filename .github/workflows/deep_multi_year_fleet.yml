name: Deep Multi-Year Historical & Multi-Exchange Harvester

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start Year for Historical Mining'
        required: false
        default: '2018'
      end_year:
        description: 'End Year for Historical Mining'
        required: false
        default: '2025'

concurrency:
  group: contract-harvester-runner
  cancel-in-progress: false

jobs:
  nse-deep-historical:
    name: NSE Multi-Year Deep Harvester (2018–2025)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Harvester Engine
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Multi-Year Backfill
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: |
          START_Y="${{ github.event.inputs.start_year || '2018' }}"
          END_Y="${{ github.event.inputs.end_year || '2025' }}"
          python3 -u harvest_multi_year_cloud.py --start-year $START_Y --end-year $END_Y

  bse-historical:
    name: BSE Corporate & Tender Harvester
    needs: [nse-deep-historical]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()

    steps:
      - name: Checkout Harvester Engine
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BSE Cloud Harvester
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: |
          python3 -u harvest_bse_cloud.py
